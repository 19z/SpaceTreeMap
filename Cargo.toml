[package]
name = "space_tree_map"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "space_tree_map"
path = "src/main.rs"
test = false
bench = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.37"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
ntfs = "0.4"
mft = { version = "0.10", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
