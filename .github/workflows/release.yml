name: Build and release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example 1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: zip
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: tar.gz
          - platform: macos-x64
            runner: macos-14
            target: x86_64-apple-darwin
            suffix: tar.gz

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libasound2-dev libudev-dev
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/space_tree_map.exe" -DestinationPath "space_tree_map-${{ matrix.platform }}.zip"
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: tar -czf "space_tree_map-${{ matrix.platform }}.tar.gz" -C "target/${{ matrix.target }}/release" space_tree_map
      - uses: actions/upload-artifact@v4
        with:
          name: spacetreemap-${{ matrix.platform }}
          path: space_tree_map-${{ matrix.platform }}.${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish successful builds
    if: always() && needs.build.result != 'cancelled'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: spacetreemap-*
          path: release-assets
          merge-multiple: true
          if-no-artifact-found: ignore
      - name: Select release metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Version must look like 1.2.3 or 1.2.3-rc.1" >&2
              exit 1
            fi
            echo "tag=v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "name=SpaceTreeMap v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            short_sha="${COMMIT_SHA:0:12}"
            echo "tag=pre-$short_sha" >> "$GITHUB_OUTPUT"
            echo "name=SpaceTreeMap Pre-release $short_sha" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check successful build artifacts
        id: assets
        run: |
          if compgen -G 'release-assets/*' > /dev/null; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
            ls -lh release-assets
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
            echo "No platform build succeeded; skipping release publication."
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.assets.outputs.has_assets == 'true'
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.metadata.outputs.name }}
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          files: release-assets/*
          fail_on_unmatched_files: false
          generate_release_notes: true
